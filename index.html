<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>มูลค่ายาคงคลัง</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
    }

    .app-frame {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
        env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: #ffffff;
    }

    .loading-screen {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #ffffff;
      opacity: 1;
      visibility: visible;
      transition: opacity 280ms ease, visibility 280ms ease;
    }

    .loading-screen.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-content {
      display: grid;
      justify-items: center;
      gap: 14px;
      color: #263238;
      text-align: center;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #dce5e8;
      border-top-color: #1976d2;
      border-radius: 50%;
      animation: spin 800ms linear infinite;
    }

    .loading-label {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }

    .app-iframe {
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
      margin: 0;
      padding: 0;
      opacity: 0;
      transition: opacity 280ms ease;
    }

    .app-iframe.is-loaded {
      opacity: 1;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation: none;
      }

      .loading-screen,
      .app-iframe {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="app-frame" aria-label="มูลค่ายาคงคลัง">
    <section class="loading-screen" id="loadingScreen" aria-live="polite">
      <div class="loading-content">
        <div class="spinner" aria-hidden="true"></div>
        <p class="loading-label">กำลังโหลดมูลค่ายาคงคลัง…</p>
      </div>
    </section>

    <iframe
      id="appFrame"
      class="app-iframe"
      title="มูลค่ายาคงคลัง"
      src="https://script.google.com/macros/s/AKfycbxB7a3hla8qEKAiLo2Sm-x7xQFybUYoCBkabQpbtp2TuCf1oi2H5hRWz2FPNlVUwyPkAA/exec"
      allow="fullscreen"
      allowfullscreen
      referrerpolicy="no-referrer"
    ></iframe>
  </main>

  <script>
    (() => {
      const iframe = document.getElementById('appFrame');
      const loadingScreen = document.getElementById('loadingScreen');

      iframe.addEventListener('load', () => {
        iframe.classList.add('is-loaded');
        loadingScreen.classList.add('is-hidden');
      }, { once: true });
    })();
  </script>
</body>
</html>
